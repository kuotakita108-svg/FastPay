<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Mobile Legends Bang Bang">
  <defs>
    <radialGradient id="mlAura" cx="50%" cy="44%" r="55%">
      <stop offset="0" stop-color="#35d8ff" stop-opacity=".95"/>
      <stop offset=".24" stop-color="#244dff" stop-opacity=".75"/>
      <stop offset=".58" stop-color="#5a20cc" stop-opacity=".5"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mlSteel" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#d8f2ff"/>
      <stop offset=".42" stop-color="#496477"/>
      <stop offset="1" stop-color="#132231"/>
    </linearGradient>
    <linearGradient id="mlGold" x1=".16" x2=".86" y1="0" y2="1">
      <stop stop-color="#fff7cd"/>
      <stop offset=".22" stop-color="#f8d28a"/>
      <stop offset=".52" stop-color="#c87331"/>
      <stop offset=".82" stop-color="#fff0b0"/>
      <stop offset="1" stop-color="#8d451e"/>
    </linearGradient>
    <linearGradient id="mlTextLight" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#fff8de"/>
      <stop offset=".42" stop-color="#f8cf8b"/>
      <stop offset=".68" stop-color="#b7642d"/>
      <stop offset="1" stop-color="#fff0be"/>
    </linearGradient>
    <filter id="mlShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000" flood-opacity=".78"/>
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#2c9cff" flood-opacity=".45"/>
    </filter>
    <filter id="mlGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="420" rx="36" fill="#000"/>
  <ellipse cx="450" cy="214" rx="286" ry="171" fill="url(#mlAura)" opacity=".94"/>
  <path d="M450 68 512 128 489 283 450 348 411 283 388 128z" fill="#15d5ff" opacity=".78" filter="url(#mlGlow)"/>
  <path d="M450 92 493 136 475 262 450 313 425 262 407 136z" fill="#86f4ff" opacity=".72"/>

  <g filter="url(#mlShadow)">
    <path d="M176 120c82 80 143 104 210 101-71 23-145 33-230-2L92 251l53-67-61-53 103 36z" fill="url(#mlSteel)"/>
    <path d="M724 120c-82 80-143 104-210 101 71 23 145 33 230-2l64 32-53-67 61-53-103 36z" fill="url(#mlSteel)"/>
    <path d="M228 236h444l-37 92H265z" fill="#392219" stroke="#243446" stroke-width="10"/>
    <path d="M186 171h528l43 82-62 47H205l-62-47z" fill="#6b3b21" stroke="#263849" stroke-width="13" stroke-linejoin="round"/>
    <path d="M206 179h488l29 57-43 33H220l-43-33z" fill="#754322"/>

    <text x="450" y="236" text-anchor="middle"
