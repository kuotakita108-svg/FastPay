          fill="#2a170d" stroke="#101827" stroke-width="13" stroke-linejoin="round">MOBILE</text>
    <text x="450" y="236" text-anchor="middle"
          font-family="Arial Black, Impact, Haettenschweiler, sans-serif"
          font-size="106" font-weight="900" letter-spacing="-4"
          fill="url(#mlTextLight)" stroke="#fff4ca" stroke-width="3" stroke-linejoin="round">MOBILE</text>

    <text x="450" y="318" text-anchor="middle"
          font-family="Arial Black, Impact, Haettenschweiler, sans-serif"
          font-size="91" font-weight="900" letter-spacing="-2"
          fill="#2a170d" stroke="#101827" stroke-width="12" stroke-linejoin="round">LEGENDS</text>
    <text x="450" y="318" text-anchor="middle"
          font-family="Arial Black, Impact, Haettenschweiler, sans-serif"
          font-size="91" font-weight="900" letter-spacing="-2"
          fill="url(#mlTextLight)" stroke="#fff4ca" stroke-width="2.5" stroke-linejoin="round">LEGENDS</text>

    <path d="M343 335h214l27 27-27 27H343l-27-27z" fill="#122033" stroke="#b88a3d" stroke-width="6"/>
    <text x="450" y="375" text-anchor="middle"
