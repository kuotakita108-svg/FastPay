server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # HTML must never be kept after a deploy. Otherwise a browser can load an
  # old index.html that points at a JavaScript bundle that no longer exists.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  # Hashed Vite bundles are safe to cache, but never fall back to index.html.
  # Returning HTML as JavaScript is what causes a blank React screen.
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri $uri/ /index.html;
  }
}
