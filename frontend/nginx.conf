server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Proxy di depan server pernah meneruskan respons Range secara terpotong,
  # sehingga browser menerima ERR_CONTENT_LENGTH_MISMATCH dan React putih.
  # Kirim aset utuh dan tanpa kompresi sampai jalur origin stabil.
  gzip off;
  max_ranges 0;

  # HTML must never be kept after a deploy. Otherwise a browser can load an
  # old index.html that points at a JavaScript bundle that no longer exists.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  # Never return index.html as JavaScript. Disable caching here as well while
  # the upstream proxy is being stabilized after the domain migration.
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri $uri/ /index.html;
  }
}
