server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Kompres aset teks agar JavaScript/CSS cepat dikirim pada koneksi seluler.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  max_ranges 0;

  # HTML must never be kept after a deploy. Otherwise a browser can load an
  # old index.html that points at a JavaScript bundle that no longer exists.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri =404;
  }

  # Nama aset Vite memiliki hash. Aman disimpan lama dan tidak akan memakai
  # versi lama setelah deploy karena nama file otomatis berubah.
  location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    try_files $uri $uri/ /index.html;
  }
}
