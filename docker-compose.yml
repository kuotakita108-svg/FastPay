services:
  backend:
    build: ./backend
    ports: ["8080:8080"]
    volumes:
      - kuotakita-data:/app/data
    environment:
      APP_PORT: "8080"
      FRONTEND_URL: http://localhost:5173
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]

volumes:
  kuotakita-data:
